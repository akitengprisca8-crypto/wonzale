<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03-flex-information</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">Information!</div>
    
    <div class="container">
        <div class="flex">
    <img src="./images/plant1.jpg" alt="green broad-leaved plant" width="256" height="250">
    <div class="text">This is a type of plant. We love this one.</div>
    </div>

      <div class="flex">
    <img src="./images/plant2.jpg" alt="sunset coloured plant" width="174" height="240">
    <div class="text">This is another type of plant. Isn't it nice?</div>
    </div>

      <div class="flex">
    <img src="./images/plant3.jpg" alt="Fresh bell peppers" width="240" height="300">
    <div class="text">We have so many plants. Yay plants.</div>
    </div>

      <div class="flex">
    <img src="./images/plant4.jpg" alt="tasty blueberries" width="169" height="300">
    <div class="text">I'm running out of things to say about plants.</div>
    </div>
    </div>

</body>
</html>
